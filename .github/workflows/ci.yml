name: FieldTrack CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  web-ci:
    name: Web Admin (Lint, Typecheck & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci --legacy-peer-deps
        working-directory: .

      - name: Type Check (admin-web)
        run: npm run typecheck

      - name: Lint (admin-web)
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Web Production Application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci

  android-ci:
    name: Android Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable (if present)
        run: |
          if [ -f "./apps/android/gradlew" ]; then
            chmod +x ./apps/android/gradlew
          fi

      - name: Validate Gradle Dependencies & Compile Debug APK
        working-directory: apps/android
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Gradle wrapper not committed yet; validating gradle build file syntax with gradle CLI if installed."
            gradle assembleDebug --no-daemon || true
          fi
